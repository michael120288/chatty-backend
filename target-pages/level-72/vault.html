<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Vault — Level 72</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #ffd700; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .vault { max-width: 500px; margin: 0 auto; background: #0d0d2e; border: 2px solid #ffd700; border-radius: 16px; padding: 40px; text-align: center; }
    .vault-icon { font-size: 64px; margin-bottom: 16px; }
    .vault-title { color: #ffd700; font-size: 20px; font-weight: bold; margin: 0 0 12px; }
    .vault-desc { color: #888; font-size: 14px; margin-bottom: 24px; }
    .treasure-list { list-style: none; padding: 0; margin: 0 0 24px; }
    .treasure-item { padding: 10px; background: #1a1500; border: 1px solid #3a3000; border-radius: 6px; margin-bottom: 8px; color: #ffd700; font-size: 14px; }
    .back-btn { padding: 12px 28px; background: #1a1500; border: 1px solid #ffd700; border-radius: 8px; color: #ffd700; font-size: 14px; cursor: pointer; }
    .back-btn:hover { background: #2a2500; }
    .location-tag { display: inline-block; margin-top: 16px; padding: 4px 12px; background: #0a1a2e; border: 1px solid #38bdf8; border-radius: 10px; font-size: 11px; color: #38bdf8; font-family: monospace; }
  </style>
</head>
<body>
  <h1>The Vault</h1>
  <p class="subtitle">You have navigated to the vault</p>

  <div class="vault" id="vault-page">
    <div class="vault-icon">🏛️</div>
    <div class="vault-title">Ancient Vault</div>
    <div class="vault-desc">The vault holds the kingdom's most precious treasures</div>
    <ul class="treasure-list">
      <li class="treasure-item">💎 Diamond Crown — 50,000 gold</li>
      <li class="treasure-item">⚔️ Excalibur — Priceless</li>
      <li class="treasure-item">📜 Ancient Scroll — 10,000 gold</li>
    </ul>
    <button class="back-btn" onclick="history.back()">← Return to Keep</button>
    <div class="location-tag">/pages/level-72/vault.html</div>
  </div>
</body>
</html>
