<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Warden's Gate — Level 70</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #f59e0b; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .gate { max-width: 560px; margin: 0 auto; background: #0d0d2e; border: 1px solid #2e1a00; border-radius: 12px; padding: 32px; }
    .gate-title { color: #f59e0b; font-size: 16px; font-weight: bold; margin: 0 0 8px; }
    .gate-desc { color: #888; font-size: 13px; margin: 0 0 24px; }
    .login-form { display: flex; flex-direction: column; gap: 14px; }
    .form-input { padding: 12px 16px; background: #1a1a2e; border: 1px solid #2a2a5e; border-radius: 8px; color: #eee; font-size: 14px; outline: none; }
    .form-input:focus { border-color: #f59e0b; }
    .login-btn { padding: 12px; background: #f59e0b; border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 14px; cursor: pointer; }
    .login-btn:hover { background: #fbbf24; }
    #login-result { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; }
    .success { background: #0a1a0a; border: 1px solid #22c55e; color: #22c55e; }
    .error { background: #1a0a0a; border: 1px solid #ef4444; color: #ef4444; }
    .session-badge { display: none; margin-top: 12px; padding: 8px 14px; background: #1a1500; border: 1px solid #f59e0b; border-radius: 6px; font-size: 12px; color: #f59e0b; }
  </style>
</head>
<body>
  <h1>The Warden's Gate</h1>
  <p class="subtitle">Use cy.session() to cache and restore login state</p>

  <div class="gate">
    <div class="gate-title">🔐 Guild Authentication</div>
    <div class="gate-desc">Enter your credentials to access the guild's inner sanctum</div>
    <div class="login-form">
      <input class="form-input" id="session-username" type="text" placeholder="Username" />
      <input class="form-input" id="session-password" type="password" placeholder="Password" />
      <button class="login-btn" id="session-login-btn" onclick="
        var u = document.getElementById('session-username').value;
        var p = document.getElementById('session-password').value;
        var result = document.getElementById('login-result');
        var badge = document.getElementById('session-badge');
        if (u === 'guild-master' && p === 'arcane-pass') {
          result.className = 'success'; result.textContent = '✅ Access granted! Welcome, Guild Master.'; result.style.display='block';
          badge.textContent = '🔑 Session active: ' + u; badge.style.display='block';
          localStorage.setItem('guild-session', u);
        } else {
          result.className = 'error'; result.textContent = '❌ Invalid credentials. Try guild-master / arcane-pass'; result.style.display='block';
        }
      ">Enter the Gate</button>
    </div>
    <div id="login-result"></div>
    <div id="session-badge" class="session-badge"></div>
  </div>

  <script>
    var s = localStorage.getItem('guild-session');
    if (s) {
      document.getElementById('login-result').className = 'success';
      document.getElementById('login-result').textContent = '✅ Session restored! Welcome back, ' + s + '.';
      document.getElementById('login-result').style.display = 'block';
      document.getElementById('session-badge').textContent = '🔑 Session active: ' + s;
      document.getElementById('session-badge').style.display = 'block';
    }
  </script>
</body>
</html>
