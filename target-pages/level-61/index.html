<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Enchanted Shop — Level 61</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #ffd700; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .shop { display: flex; gap: 20px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
    .product-card { background: #0d0d2e; border: 1px solid #2a2a5e; border-radius: 12px; padding: 20px; width: 220px; }
    .product-card:first-child { border-color: #ff6b35; }
    .product-card:nth-child(2) { border-color: #4da6ff; }
    .product-card:nth-child(3) { border-color: #22c55e; }
    .product-name { font-weight: bold; font-size: 16px; margin: 0 0 8px; color: #ffd700; }
    .product-price { color: #22c55e; font-size: 14px; margin-bottom: 8px; }
    .product-stock { color: #888; font-size: 12px; margin-bottom: 12px; }
    .product-stock.in-stock { color: #22c55e; }
    .product-stock.out-of-stock { color: #ef4444; }
    .product-rating { color: #ffd700; font-size: 12px; }
    .buy-btn { margin-top: 10px; width: 100%; padding: 8px; border-radius: 6px; border: none; background: #2a2a5e; color: #eee; cursor: pointer; font-size: 13px; }
    .buy-btn:hover { background: #3a3a7e; }
  </style>
</head>
<body>
  <h1>The Enchanted Shop</h1>
  <p class="subtitle">Use .within() to scope your queries inside each product card</p>

  <div class="shop">
    <div class="product-card" id="card-sword">
      <div class="product-name">Dragon Sword</div>
      <div class="product-price">1200 gold</div>
      <div class="product-stock in-stock">In Stock</div>
      <div class="product-rating">★★★★★ 4.9</div>
      <button class="buy-btn">Buy Now</button>
    </div>
    <div class="product-card" id="card-shield">
      <div class="product-name">Ice Shield</div>
      <div class="product-price">800 gold</div>
      <div class="product-stock out-of-stock">Out of Stock</div>
      <div class="product-rating">★★★★☆ 4.2</div>
      <button class="buy-btn" disabled>Unavailable</button>
    </div>
    <div class="product-card" id="card-potion">
      <div class="product-name">Healing Potion</div>
      <div class="product-price">50 gold</div>
      <div class="product-stock in-stock">In Stock</div>
      <div class="product-rating">★★★☆☆ 3.8</div>
      <button class="buy-btn">Buy Now</button>
    </div>
  </div>
</body>
</html>
