<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Enchanted Shop — Level 61</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #a67c00; text-align: center; }
    .subtitle { text-align: center; color: #6b6b7d; margin-bottom: 40px; }
    .shop { display: flex; gap: 20px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
    .product-card { background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 12px; padding: 20px; width: 220px; box-shadow: 0 12px 32px rgba(80,60,160,.08); }
    .product-card:first-child { border-color: #d97757; }
    .product-card:nth-child(2) { border-color: #6f8cff; }
    .product-card:nth-child(3) { border-color: #3fae62; }
    .product-name { font-weight: bold; font-size: 16px; margin: 0 0 8px; color: #a67c00; }
    .product-price { color: #16a34a; font-size: 14px; margin-bottom: 8px; }
    .product-stock { color: #8a8a9a; font-size: 12px; margin-bottom: 12px; }
    .product-stock.in-stock { color: #16a34a; }
    .product-stock.out-of-stock { color: #dc2626; }
    .product-rating { color: #a67c00; font-size: 12px; }
    .buy-btn { margin-top: 10px; width: 100%; padding: 8px; border-radius: 6px; border: none; background: #eceaf7; color: #121212; cursor: pointer; font-size: 13px; }
    .buy-btn:hover { background: #ded9f5; }
  </style>
</head>
<body>
  <h1>The Enchanted Shop</h1>
  <p class="subtitle">Use .within() to scope your queries inside each product card</p>

  <div class="shop">
    <div class="product-card" id="card-sword">
      <div class="product-name">Dragon Sword</div>
      <div class="product-price">1200 gold</div>
      <div class="product-stock in-stock">In Stock</div>
      <div class="product-rating">★★★★★ 4.9</div>
      <button class="buy-btn">Buy Now</button>
    </div>
    <div class="product-card" id="card-shield">
      <div class="product-name">Ice Shield</div>
      <div class="product-price">800 gold</div>
      <div class="product-stock out-of-stock">Out of Stock</div>
      <div class="product-rating">★★★★☆ 4.2</div>
      <button class="buy-btn" disabled>Unavailable</button>
    </div>
    <div class="product-card" id="card-potion">
      <div class="product-name">Healing Potion</div>
      <div class="product-price">50 gold</div>
      <div class="product-stock in-stock">In Stock</div>
      <div class="product-rating">★★★☆☆ 3.8</div>
      <button class="buy-btn">Buy Now</button>
    </div>
  </div>
</body>
</html>
