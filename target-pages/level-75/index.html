<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Arcane Vault</title>
</head>
<body>
  <script>
    // Protected page — redirect to login if not authenticated
    var user = localStorage.getItem('vault-user');
    if (!user) {
      window.location.replace('login.html');
    } else {
      window.location.replace('dashboard.html');
    }
  </script>
</body>
</html>
