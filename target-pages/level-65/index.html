<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Ancient Tome — Level 65</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #ec4899; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .tome-area { max-width: 600px; margin: 0 auto; }
    .tome { background: #0d0d2e; border: 1px solid #3a0a2e; border-radius: 12px; padding: 32px; text-align: center; }
    .tome-title { color: #ec4899; font-size: 16px; font-weight: bold; margin: 0 0 24px; }
    .spell-book { position: relative; display: inline-block; margin-bottom: 24px; }
    .spell-icon { font-size: 80px; cursor: pointer; user-select: none; transition: transform 0.1s; }
    .spell-icon:hover { transform: scale(1.05); }
    #context-menu { display: none; position: absolute; top: 50%; left: 105%; background: #1a1a2e; border: 1px solid #2a2a5e; border-radius: 8px; padding: 4px; min-width: 160px; z-index: 10; }
    .ctx-item { padding: 8px 14px; cursor: pointer; font-size: 13px; border-radius: 4px; color: #ccc; }
    .ctx-item:hover { background: #2a2a4e; color: #eee; }
    .action-label { font-size: 13px; color: #888; margin-bottom: 16px; }
    #dbl-result { display: none; padding: 12px; background: #0a0a2e; border: 1px solid #ec4899; border-radius: 8px; color: #ec4899; font-weight: bold; margin-top: 16px; }
    #ctx-result { display: none; padding: 12px; background: #0a1a2e; border: 1px solid #a855f7; border-radius: 8px; color: #a855f7; font-weight: bold; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>The Ancient Tome</h1>
  <p class="subtitle">Use .dblclick() to unlock and .rightclick() to reveal the context menu</p>

  <div class="tome-area">
    <div class="tome">
      <div class="tome-title">📜 Arcane Tome</div>
      <div class="action-label">Double-click to unlock the tome. Right-click for spell options.</div>
      <div class="spell-book">
        <div class="spell-icon" id="tome-icon"
          ondblclick="document.getElementById('dbl-result').style.display='block'"
          oncontextmenu="event.preventDefault(); document.getElementById('context-menu').style.display='block'">
          📖
        </div>
        <div id="context-menu">
          <div class="ctx-item" onclick="document.getElementById('ctx-result').textContent='✨ Cast Fireball!'; document.getElementById('ctx-result').style.display='block'; document.getElementById('context-menu').style.display='none'">🔥 Cast Fireball</div>
          <div class="ctx-item" onclick="document.getElementById('ctx-result').textContent='❄️ Cast Blizzard!'; document.getElementById('ctx-result').style.display='block'; document.getElementById('context-menu').style.display='none'">❄️ Cast Blizzard</div>
          <div class="ctx-item" id="bookmark-spell" onclick="document.getElementById('ctx-result').textContent='📌 Spell bookmarked!'; document.getElementById('ctx-result').style.display='block'; document.getElementById('context-menu').style.display='none'">📌 Bookmark Spell</div>
        </div>
      </div>
      <div id="dbl-result">🔓 Tome unlocked! Ancient knowledge revealed.</div>
      <div id="ctx-result"></div>
    </div>
  </div>

  <script>
    document.addEventListener('click', () => {
      document.getElementById('context-menu').style.display = 'none';
    });
  </script>
</body>
</html>
