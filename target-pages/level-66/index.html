<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Mana Crystal — Level 66</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #06b6d4; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .crystal-lab { max-width: 580px; margin: 0 auto; background: #0d0d2e; border: 1px solid #0a2e3a; border-radius: 12px; padding: 32px; text-align: center; }
    .lab-title { color: #06b6d4; font-size: 16px; font-weight: bold; margin: 0 0 24px; }
    .slider-section { margin-bottom: 28px; }
    .slider-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 10px; }
    .mana-slider { width: 100%; height: 8px; -webkit-appearance: none; appearance: none; background: #1a1a2e; border-radius: 4px; outline: none; cursor: pointer; }
    .mana-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #06b6d4; cursor: pointer; }
    #mana-value { font-size: 36px; font-weight: bold; color: #06b6d4; margin: 12px 0; }
    .hover-zone { margin-bottom: 24px; }
    #crystal { width: 100px; height: 100px; margin: 0 auto; background: linear-gradient(135deg, #06b6d4, #0a2e3a); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    #crystal:hover { transform: scale(1.1); box-shadow: 0 0 30px #06b6d4; }
    #tooltip { display: none; margin-top: 12px; padding: 8px 16px; background: #0a1a2e; border: 1px solid #06b6d4; border-radius: 6px; color: #06b6d4; font-size: 13px; }
    #mouseover-result { display: none; margin-top: 12px; padding: 10px; background: #0a2e3a; border: 1px solid #06b6d4; border-radius: 6px; color: #06b6d4; font-weight: bold; }
  </style>
</head>
<body>
  <h1>The Mana Crystal</h1>
  <p class="subtitle">Use .trigger() to fire mouseover, input, and change events</p>

  <div class="crystal-lab">
    <div class="lab-title">💎 Crystal Calibration Lab</div>

    <div class="slider-section">
      <div class="slider-label">Mana Capacity</div>
      <input type="range" id="mana-slider" class="mana-slider" min="0" max="100" value="50"
        oninput="document.getElementById('mana-value').textContent = this.value" />
      <div id="mana-value">50</div>
    </div>

    <div class="hover-zone">
      <div id="crystal" onmouseover="document.getElementById('tooltip').style.display='block'; document.getElementById('mouseover-result').style.display='block'">💎</div>
      <div id="tooltip">⚡ Crystal power: MAXIMUM</div>
      <div id="mouseover-result">✅ Crystal activated by hover!</div>
    </div>
  </div>
</body>
</html>
