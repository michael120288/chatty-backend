<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Magic Spellbook</title>
  <style>
    body { background: #f8f8f8; color: #121212; font-family: monospace; padding: 20px; }
    h1 { color: #4a3a8f; }
    .panel { background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0 12px 32px rgba(80,60,160,.1); }
    .btn { background: #6f8cff; color: #ffffff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-family: monospace; margin-right: 8px; margin-bottom: 8px; }
    .btn.cast { background: #8f74e8; }
    .btn.save { background: #15803d; }
    .btn.load { background: #4a3a8f; }
    #log { background: #f8f8f8; border: 1px solid rgba(18,18,18,.14); border-radius: 4px; padding: 10px; min-height: 60px; color: #15803d; font-size: 12px; }
    h2 { color: #6f5aa8; margin-top: 0; font-size: 16px; }
  </style>
</head>
<body>
  <h1>The Magic Spellbook</h1>

  <div class="panel">
    <h2>Spell Actions</h2>
    <button id="cast-btn" class="btn cast">Cast Fireball</button>
    <button id="save-btn" class="btn save">Save Progress</button>
    <button id="load-btn" class="btn load">Load Progress</button>
    <button id="notify-btn" class="btn">Notify Party</button>
    <button id="error-btn" class="btn">Trigger Error</button>
  </div>

  <div class="panel">
    <h2>Event Log</h2>
    <div id="log">Awaiting actions...</div>
  </div>

  <script>
    const log = document.getElementById('log');

    function appendLog(msg) {
      log.textContent += '\n' + msg;
    }

    // Window-level functions that can be stubbed/spied on
    window.saveProgress = function (data) {
      appendLog('Saved: ' + JSON.stringify(data));
      return { success: true, savedAt: Date.now() };
    };

    window.loadProgress = function () {
      appendLog('Loaded progress');
      return { xp: 1500, level: 42, hero: 'Aria' };
    };

    window.castSpell = function (spellName) {
      appendLog('Casting: ' + spellName);
      return spellName + ' cast successfully!';
    };

    window.sendNotification = function (recipient, message) {
      appendLog('Notifying ' + recipient + ': ' + message);
    };

    window.riskyOperation = function () {
      throw new Error('Spell backfired!');
    };

    // Button wiring
    document.getElementById('cast-btn').addEventListener('click', function () {
      window.castSpell('Fireball');
    });

    document.getElementById('save-btn').addEventListener('click', function () {
      window.saveProgress({ xp: 100, hero: 'Aria' });
    });

    document.getElementById('load-btn').addEventListener('click', function () {
      window.loadProgress();
    });

    document.getElementById('notify-btn').addEventListener('click', function () {
      window.sendNotification('Orion', 'Meet at the crossroads!');
      window.sendNotification('Lyra', 'Bring potions!');
    });

    document.getElementById('error-btn').addEventListener('click', function () {
      try {
        window.riskyOperation();
      } catch (e) {
        appendLog('Error caught: ' + e.message);
      }
    });
  </script>
</body>
</html>
