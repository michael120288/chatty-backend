<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Oracle's Chamber — Level 12</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #8f74e8; text-align: center; }
    .subtitle { text-align: center; color: #6b6b76; margin-bottom: 40px; }
    .oracle-chamber { max-width: 500px; margin: 0 auto; text-align: center; }
    .oracle-statue { font-size: 80px; margin-bottom: 24px; filter: drop-shadow(0 0 12px rgba(143,116,232,.35)); }
    .buttons-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .oracle-btn {
      padding: 14px 24px; border: none; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    .oracle-btn:active { transform: scale(0.97); }
    #confirm-btn { background: #8f74e8; color: #fff; }
    #confirm-btn:hover { background: #7458d6; }
    #alert-btn { background: #ffffff; color: #4a3a8f; border: 1px solid rgba(18,18,18,.14); }
    #alert-btn:hover { background: #f3f0fb; }
    #prompt-btn { background: #ffffff; color: #4a3a8f; border: 1px solid rgba(18,18,18,.14); }
    #prompt-btn:hover { background: #f3f0fb; }
    #oracle-result {
      padding: 20px; border-radius: 10px; min-height: 60px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: bold; transition: all 0.3s;
      background: #f3f0fb; border: 1px solid rgba(18,18,18,.08); color: #9a94ab; font-style: italic;
    }
    #oracle-result.accepted { background: #eafaf3; border-color: #34c78c; color: #1f9d6b; }
    #oracle-result.rejected { background: #fdeef0; border-color: #e0577a; color: #c23a5e; }
    #oracle-result.alerted { background: #eef2ff; border-color: #6f8cff; color: #4a63c9; }
    #oracle-result.prompted { background: #f3ecff; border-color: #a78bfa; color: #6f5aa8; }
    .dialog-type { margin-top: 8px; font-size: 12px; color: #9a94ab; }
  </style>
</head>
<body>
  <h1>The Oracle's Chamber</h1>
  <p class="subtitle">Speak to the Oracle — handle what it returns</p>

  <div class="oracle-chamber">
    <div class="oracle-statue">🔮</div>

    <div class="buttons-row">
      <button class="oracle-btn" id="confirm-btn">⚔️ Challenge the Oracle (confirm)</button>
      <button class="oracle-btn" id="alert-btn">📢 Hear the Oracle's Proclamation (alert)</button>
      <button class="oracle-btn" id="prompt-btn">🗣️ Ask the Oracle a Question (prompt)</button>
    </div>

    <div id="oracle-result">Awaiting your approach...</div>
    <div class="dialog-type" id="dialog-type"></div>
  </div>

  <script>
    document.getElementById('confirm-btn').addEventListener('click', () => {
      const accepted = confirm("Do you accept the Oracle's challenge?");
      const result = document.getElementById('oracle-result');
      if (accepted) {
        result.className = 'accepted';
        result.textContent = 'Challenge Accepted!';
      } else {
        result.className = 'rejected';
        result.textContent = 'You fled from the Oracle.';
      }
      document.getElementById('dialog-type').textContent = 'confirm dialog handled';
    });

    document.getElementById('alert-btn').addEventListener('click', () => {
      alert('The Oracle proclaims: All tests shall pass!');
      const result = document.getElementById('oracle-result');
      result.className = 'alerted';
      result.textContent = 'Proclamation Received!';
      document.getElementById('dialog-type').textContent = 'alert dialog handled';
    });

    document.getElementById('prompt-btn').addEventListener('click', () => {
      const answer = prompt('Oracle: What is the name of the testing framework?');
      const result = document.getElementById('oracle-result');
      if (answer && answer.toLowerCase() === 'playwright') {
        result.className = 'accepted';
        result.textContent = 'The Oracle is pleased! Correct answer!';
      } else {
        result.className = 'prompted';
        result.textContent = 'Oracle received: ' + (answer || '(nothing)');
      }
      document.getElementById('dialog-type').textContent = 'prompt dialog handled';
    });
  </script>
</body>
</html>
