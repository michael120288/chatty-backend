<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Download Warden</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f8f8f8; color: #121212; font-family: 'Segoe UI', sans-serif;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; min-height: 100vh; gap: 24px; }
    h1 { color: #4a3a8f; font-size: 1.8rem; }
    p  { color: rgba(18,18,18,.6); font-size: 0.95rem; max-width: 420px; text-align: center; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    button {
      padding: 12px 32px; border: none; border-radius: 8px; font-size: 1rem;
      cursor: pointer; font-weight: 600; transition: background 0.2s;
    }
    #download-btn   { background: #8f74e8; color: #ffffff; }
    #download-btn:hover { background: #7c5fe0; }
    #download-csv   { background: #6f8cff; color: #fff; }
    #download-csv:hover { background: #5a72e0; }
    #cancel-btn     { background: #dc2626; color: #fff; }
    #cancel-btn:hover { background: #b91c1c; }
    #status { color: #15803d; font-size: 0.9rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>📥 The Download Warden</h1>
  <p>Use Playwright's download API to intercept, save, inspect, and cancel file downloads.</p>

  <div class="btn-group">
    <button id="download-btn"  onclick="downloadTxt()">⬇ Download report.txt</button>
    <button id="download-csv"  onclick="downloadCsv()">⬇ Download data.csv</button>
    <button id="cancel-btn"    onclick="downloadCancel()">⬇ Download (for cancel test)</button>
  </div>

  <div id="status"></div>

  <script>
    function triggerDownload(filename, content) {
      const a = document.createElement('a');
      a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(content);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      document.getElementById('status').textContent = 'Download triggered: ' + filename;
    }
    function downloadTxt()    { triggerDownload('report.txt', 'The arcane report is ready.\nGuild: Order of the Arcane'); }
    function downloadCsv()    { triggerDownload('data.csv',   'spell,power\nFireball,99\nIce Lance,88'); }
    function downloadCancel() { triggerDownload('cancel.txt', 'This download should be cancelled.'); }
  </script>
</body>
</html>
