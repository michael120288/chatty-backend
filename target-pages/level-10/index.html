<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Grand Quest — Level 10</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a00; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #ffd700; text-align: center; font-size: 2em; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .todo-app { max-width: 560px; margin: 0 auto; }
    .todo-header {
      background: linear-gradient(135deg, #1a1500, #2a2000);
      border: 2px solid #ffd700; border-radius: 12px 12px 0 0; padding: 20px 24px;
    }
    .todo-header h2 { margin: 0; color: #ffd700; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
    .add-form {
      display: flex; gap: 8px; margin-top: 16px;
    }
    #todo-input {
      flex: 1; padding: 10px 14px; background: #0a0a00; border: 1px solid #3a3000;
      border-radius: 6px; color: #eee; font-size: 15px;
    }
    #todo-input:focus { outline: none; border-color: #ffd700; }
    #add-btn {
      background: #ffd700; color: #000; border: none; padding: 10px 18px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; white-space: nowrap;
    }
    #add-btn:hover { background: #ffcc00; }
    .todo-list-container {
      background: #0d0d00; border: 1px solid #2a2000; border-top: none;
      border-radius: 0 0 12px 12px; padding: 16px;
    }
    #todo-list { list-style: none; padding: 0; margin: 0; }
    .todo-item {
      display: flex; align-items: center; gap: 12px;
      background: #1a1500; border: 1px solid #2a2000; border-radius: 8px;
      padding: 12px 14px; margin-bottom: 8px; transition: opacity 0.3s;
    }
    .todo-item.completed { opacity: 0.5; }
    .todo-item.completed .todo-text { text-decoration: line-through; color: #555; }
    .todo-check { width: 18px; height: 18px; cursor: pointer; accent-color: #ffd700; flex-shrink: 0; }
    .todo-text { flex: 1; font-size: 15px; }
    .todo-delete {
      background: #2e0a0a; color: #e94560; border: 1px solid #e94560;
      border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
      flex-shrink: 0;
    }
    .todo-delete:hover { background: #e94560; color: white; }
    #empty-state { text-align: center; color: #555; padding: 20px; font-style: italic; }
    .stats-row {
      display: flex; justify-content: space-between; margin-top: 12px;
      padding-top: 12px; border-top: 1px solid #2a2000; font-size: 13px; color: #888;
    }
    #item-count { color: #ffd700; }
  </style>
</head>
<body>
  <h1>⚔️ The Grand Quest</h1>
  <p class="subtitle">Prove your mastery — complete the epic todo challenge</p>

  <div class="todo-app">
    <div class="todo-header">
      <h2>Quest Log</h2>
      <div class="add-form">
        <input type="text" id="todo-input" placeholder="Add a quest objective..." autocomplete="off" />
        <button id="add-btn">+ Add</button>
      </div>
    </div>

    <div class="todo-list-container">
      <ul id="todo-list">
        <li id="empty-state">No quests yet. Add your first objective above.</li>
      </ul>
      <div class="stats-row">
        <span id="item-count">0 items</span>
        <span id="completed-count">0 completed</span>
      </div>
    </div>
  </div>

  <script>
    let items = [];

    function render() {
      const list = document.getElementById('todo-list');
      const empty = document.getElementById('empty-state');
      const countEl = document.getElementById('item-count');
      const completedEl = document.getElementById('completed-count');

      list.innerHTML = '';

      if (items.length === 0) {
        const li = document.createElement('li');
        li.id = 'empty-state';
        li.textContent = 'No quests yet. Add your first objective above.';
        list.appendChild(li);
      } else {
        items.forEach((item, index) => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (item.completed ? ' completed' : '');

          const check = document.createElement('input');
          check.type = 'checkbox';
          check.className = 'todo-check';
          check.checked = item.completed;
          check.addEventListener('change', () => {
            items[index].completed = check.checked;
            render();
          });

          const text = document.createElement('span');
          text.className = 'todo-text';
          text.textContent = item.text;

          const del = document.createElement('button');
          del.className = 'todo-delete';
          del.textContent = 'Delete';
          del.addEventListener('click', () => {
            items.splice(index, 1);
            render();
          });

          li.appendChild(check);
          li.appendChild(text);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      countEl.textContent = items.length + ' item' + (items.length !== 1 ? 's' : '');
      completedEl.textContent = items.filter(i => i.completed).length + ' completed';
    }

    document.getElementById('add-btn').addEventListener('click', () => {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (text) {
        items.push({ text, completed: false });
        input.value = '';
        render();
      }
    });

    document.getElementById('todo-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('add-btn').click();
      }
    });

    render();
  </script>
</body>
</html>
