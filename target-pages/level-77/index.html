<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hero Registry</title>
  <style>
    body { background: #f8f8f8; color: #121212; font-family: monospace; padding: 20px; }
    h1 { color: #345bb0; }
    .character {
      background: #ffffff;
      border: 2px solid #6f8cff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(80,60,160,.1);
    }
    .name { color: #b8860b; font-size: 20px; font-weight: bold; }
    .badge { background: #eafaf0; color: #15803d; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    a { color: #345bb0; text-decoration: none; }
    #stats {
      color: rgb(184, 134, 11);
      font-size: 16px;
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    .stat { background: #eef2ff; padding: 4px 10px; border-radius: 4px; }
    img { border-radius: 50%; border: 2px solid #6f8cff; display: block; margin-top: 8px; }
    .guild { margin-top: 20px; }
    .guild-title { color: #6f5aa8; font-size: 18px; margin-bottom: 8px; }
    .members { display: flex; gap: 8px; flex-wrap: wrap; }
    .member { background: #f3effe; border: 1px solid #a78bfa; padding: 4px 12px; border-radius: 12px; color: #4a3a8f; }
  </style>
</head>
<body>
  <h1>The Hero Registry</h1>

  <!-- Main character card with data attributes -->
  <div
    id="hero"
    class="character active"
    data-type="warrior"
    data-level="42"
    data-guild="storm-riders"
    title="Main Hero"
    aria-label="hero character"
    tabindex="0"
  >
    <span class="name">Aria Stormwind</span>
    <span class="badge" data-rank="legend">Legend</span>
    <p class="bio">Master of the blade and arcane arts.</p>
    <div id="stats" style="color: rgb(184, 134, 11); font-size: 16px; display: flex; gap: 12px; margin-top: 12px;">
      <span class="stat">STR: 18</span>
      <span class="stat">INT: 16</span>
      <span class="stat">AGI: 20</span>
    </div>
    <img id="avatar" src="/avatar.png" alt="Hero Avatar" width="80" height="80">
  </div>

  <!-- Link element -->
  <a href="/quest" id="quest-link" target="_blank" rel="noopener" data-action="navigate">
    Begin Quest →
  </a>

  <!-- Guild section -->
  <div class="guild" id="guild-panel" data-faction="alliance">
    <div class="guild-title">Storm Riders Guild</div>
    <div class="members">
      <span class="member">Aria</span>
      <span class="member">Orion</span>
      <span class="member">Lyra</span>
    </div>
  </div>
</body>
</html>
