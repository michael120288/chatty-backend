<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Realm Hierarchy — Level 60</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #ff6b35; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .realm { display: flex; gap: 24px; max-width: 800px; margin: 0 auto; }
    .kingdom { background: #0d0d2e; border: 1px solid #3a1a1a; border-radius: 12px; padding: 24px; flex: 1; }
    #fire-kingdom { border-color: #ff6b35; }
    #ice-kingdom { border-color: #4da6ff; }
    .kingdom-name { font-size: 18px; font-weight: bold; margin: 0 0 16px; }
    #fire-kingdom .kingdom-name { color: #ff6b35; }
    #ice-kingdom .kingdom-name { color: #4da6ff; }
    .subjects { list-style: none; padding: 0; margin: 0 0 16px; }
    .subject { padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; background: #1a1a2e; color: #888; }
    .subject.active { background: #2e1a0a; color: #ff6b35; font-weight: bold; border: 1px solid #ff6b35; }
    #ice-kingdom .subject.active { background: #0a1a2e; color: #4da6ff; border-color: #4da6ff; }
    .treasury { background: #1a1500; border: 1px solid #3a3000; border-radius: 8px; padding: 12px; }
    .vault-label { font-size: 11px; text-transform: uppercase; color: #666; display: block; margin-bottom: 4px; letter-spacing: 1px; }
    .gold-amount { color: #ffd700; font-weight: bold; }
  </style>
</head>
<body>
  <h1>The Realm Hierarchy</h1>
  <p class="subtitle">Traverse the DOM tree to find what lies within each kingdom</p>

  <div class="realm" id="realm">
    <div class="kingdom" id="fire-kingdom">
      <h2 class="kingdom-name">Fire Kingdom</h2>
      <ul class="subjects">
        <li class="subject">Fire Mage</li>
        <li class="subject active">Fire Knight</li>
        <li class="subject">Fire Archer</li>
      </ul>
      <div class="treasury" data-gold="500">
        <span class="vault-label">Treasury</span>
        <span class="gold-amount">500 gold</span>
      </div>
    </div>

    <div class="kingdom" id="ice-kingdom">
      <h2 class="kingdom-name">Ice Kingdom</h2>
      <ul class="subjects">
        <li class="subject active">Ice Mage</li>
        <li class="subject">Ice Knight</li>
        <li class="subject">Ice Archer</li>
      </ul>
      <div class="treasury" data-gold="300">
        <span class="vault-label">Treasury</span>
        <span class="gold-amount">300 gold</span>
      </div>
    </div>
  </div>
</body>
</html>
