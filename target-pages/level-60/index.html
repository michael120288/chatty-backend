<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Realm Hierarchy — Level 60</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #c2540f; text-align: center; }
    .subtitle { text-align: center; color: #6b6b7d; margin-bottom: 40px; }
    .realm { display: flex; gap: 24px; max-width: 800px; margin: 0 auto; }
    .kingdom { background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 12px; padding: 24px; flex: 1; box-shadow: 0 12px 32px rgba(80,60,160,.08); }
    #fire-kingdom { border-color: #d97757; }
    #ice-kingdom { border-color: #6f8cff; }
    .kingdom-name { font-size: 18px; font-weight: bold; margin: 0 0 16px; }
    #fire-kingdom .kingdom-name { color: #c2540f; }
    #ice-kingdom .kingdom-name { color: #4a63c9; }
    .subjects { list-style: none; padding: 0; margin: 0 0 16px; }
    .subject { padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; background: #f2f2f7; color: #8a8a9a; }
    .subject.active { background: #ffe9e0; color: #c2540f; font-weight: bold; border: 1px solid #d97757; }
    #ice-kingdom .subject.active { background: #eaf0ff; color: #4a63c9; border-color: #6f8cff; }
    .treasury { background: #fff8e1; border: 1px solid rgba(18,18,18,.08); border-radius: 8px; padding: 12px; }
    .vault-label { font-size: 11px; text-transform: uppercase; color: #8a8a9a; display: block; margin-bottom: 4px; letter-spacing: 1px; }
    .gold-amount { color: #a67c00; font-weight: bold; }
  </style>
</head>
<body>
  <h1>The Realm Hierarchy</h1>
  <p class="subtitle">Traverse the DOM tree to find what lies within each kingdom</p>

  <div class="realm" id="realm">
    <div class="kingdom" id="fire-kingdom">
      <h2 class="kingdom-name">Fire Kingdom</h2>
      <ul class="subjects">
        <li class="subject">Fire Mage</li>
        <li class="subject active">Fire Knight</li>
        <li class="subject">Fire Archer</li>
      </ul>
      <div class="treasury" data-gold="500">
        <span class="vault-label">Treasury</span>
        <span class="gold-amount">500 gold</span>
      </div>
    </div>

    <div class="kingdom" id="ice-kingdom">
      <h2 class="kingdom-name">Ice Kingdom</h2>
      <ul class="subjects">
        <li class="subject active">Ice Mage</li>
        <li class="subject">Ice Knight</li>
        <li class="subject">Ice Archer</li>
      </ul>
      <div class="treasury" data-gold="300">
        <span class="vault-label">Treasury</span>
        <span class="gold-amount">300 gold</span>
      </div>
    </div>
  </div>
</body>
</html>
