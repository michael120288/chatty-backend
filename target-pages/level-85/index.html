<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Shadow Realm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #141026; color: #e8e4fb; font-family: 'Segoe UI', sans-serif;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; min-height: 100vh; gap: 24px; padding: 20px; }
    h1 { color: #c3acff; font-size: 1.8rem; }
    p  { color: #b8b0d9; font-size: 0.9rem; max-width: 460px; text-align: center; }
    .host-label { color: #c3acff; font-size: 0.8rem; text-transform: uppercase;
                  letter-spacing: 1px; margin-bottom: 6px; }
    .host-box { background: #1e1838; border: 2px dashed #8f74e8;
                border-radius: 10px; padding: 16px; min-width: 320px; }
  </style>
</head>
<body>
  <h1>👥 The Shadow Realm</h1>
  <p>Use Cypress's <code>.shadow()</code> to pierce Shadow DOM and find elements hidden within.</p>

  <!-- Shadow host 1: spell card -->
  <div class="host-box">
    <div class="host-label">Shadow Host #1 — #spell-host</div>
    <div id="spell-host"></div>
  </div>

  <!-- Shadow host 2: profile card -->
  <div class="host-box">
    <div class="host-label">Shadow Host #2 — #profile-host</div>
    <div id="profile-host"></div>
  </div>

  <!-- Shadow host 3: nested -->
  <div class="host-box">
    <div class="host-label">Shadow Host #3 (nested) — #nested-host</div>
    <div id="nested-host"></div>
  </div>

  <script>
    // ── Shadow Host 1: spell card ────────────────────────────────────────────
    const spellHost = document.getElementById('spell-host');
    const spellRoot = spellHost.attachShadow({ mode: 'open' });
    spellRoot.innerHTML = `
      <style>
        .spell-card { background:#241c3f; border:1px solid #8f74e8; border-radius:8px;
                      padding:12px; color:#e8e4fb; }
        .spell-name { color:#c3acff; font-weight:700; font-size:1.1rem; }
        .spell-type { color:#a78bfa; font-size:0.8rem; margin-top:4px; }
        button { margin-top:10px; padding:6px 16px; background:#8f74e8; color:#fff;
                 border:none; border-radius:6px; cursor:pointer; }
      </style>
      <div class="spell-card">
        <div class="spell-name" id="shadow-spell-name">Fireball</div>
        <div class="spell-type">Destruction Magic · Power: 99</div>
        <button id="shadow-cast-btn">Cast Spell</button>
      </div>
    `;
    spellRoot.getElementById('shadow-cast-btn').addEventListener('click', () => {
      spellRoot.getElementById('shadow-spell-name').textContent = 'Fireball CAST!';
    });

    // ── Shadow Host 2: profile card ──────────────────────────────────────────
    const profileHost = document.getElementById('profile-host');
    const profileRoot = profileHost.attachShadow({ mode: 'open' });
    profileRoot.innerHTML = `
      <style>
        .profile { background:#182a35; border:1px solid #6f8cff;
                   border-radius:8px; padding:12px; color:#e8e4fb; }
        .profile-name { color:#6f8cff; font-weight:700; }
        .profile-rank { color:#b8b0d9; font-size:0.85rem; }
        input { margin-top:8px; background:#0f1830; border:1px solid #6f8cff;
                color:#e8e4fb; padding:4px 8px; border-radius:4px; }
      </style>
      <div class="profile">
        <div class="profile-name" id="shadow-mage-name">Aria the Archmage</div>
        <div class="profile-rank">Rank: Grand Mage</div>
        <input type="text" id="shadow-search" placeholder="Search spells..." />
      </div>
    `;

    // ── Shadow Host 3: nested shadow ─────────────────────────────────────────
    const nestedHost = document.getElementById('nested-host');
    const nestedRoot = nestedHost.attachShadow({ mode: 'open' });
    nestedRoot.innerHTML = `
      <style>
        .outer { background:#241830; border:1px solid #a78bfa;
                 border-radius:8px; padding:12px; color:#e8e4fb; }
      </style>
      <div class="outer">
        <span>Outer shadow layer</span>
        <div id="inner-host"></div>
      </div>
    `;
    const innerHost = nestedRoot.getElementById('inner-host');
    const innerRoot = innerHost.attachShadow({ mode: 'open' });
    innerRoot.innerHTML = `
      <style>
        .inner { color:#c3acff; margin-top:8px; font-size:0.9rem; }
      </style>
      <div class="inner" id="shadow-inner-text">Inner shadow secret: ARCANE_KEY</div>
    `;
  </script>
</body>
</html>
