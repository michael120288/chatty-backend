<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Arcane Notification — Level 67</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #eee; margin: 0; padding: 40px; }
    h1 { color: #f97316; text-align: center; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .stub-lab { max-width: 580px; margin: 0 auto; background: #0d0d2e; border: 1px solid #2e1a00; border-radius: 12px; padding: 32px; }
    .lab-title { color: #f97316; font-size: 16px; font-weight: bold; margin: 0 0 24px; }
    .action-btn { display: block; width: 100%; padding: 14px; background: #2e1a00; border: 1px solid #f97316; border-radius: 8px; color: #f97316; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 16px; text-align: center; }
    .action-btn:hover { background: #3e2a00; }
    .log-area { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px; padding: 16px; min-height: 80px; font-family: monospace; font-size: 12px; color: #666; }
    .log-entry { color: #22c55e; margin-bottom: 4px; }
    .note { margin-top: 16px; font-size: 12px; color: #555; font-style: italic; }
  </style>
</head>
<body>
  <h1>The Arcane Notification</h1>
  <p class="subtitle">Use cy.stub() to intercept window.alert and window.confirm</p>

  <div class="stub-lab">
    <div class="lab-title">🔔 Notification Chamber</div>

    <button class="action-btn" id="alert-btn" onclick="window.alert('⚡ Spell cast successfully!')">Cast Spell (triggers alert)</button>
    <button class="action-btn" id="confirm-btn" onclick="
      var r = window.confirm('Are you sure you want to banish the demon?');
      document.getElementById('confirm-result').textContent = r ? '✅ Demon banished!' : '❌ Demon remains.';
      document.getElementById('confirm-result').style.display = 'block';
    ">Banish Demon (triggers confirm)</button>

    <div class="log-area" id="log-area">
      <div style="color:#444">// Stub window.alert and window.confirm to intercept these calls</div>
    </div>
    <div id="confirm-result" style="display:none; margin-top:12px; padding:10px; background:#0a1a0a; border:1px solid #22c55e; border-radius:6px; color:#22c55e; font-weight:bold;"></div>
    <p class="note">Hint: use cy.stub(win, 'alert') in a cy.window().then() callback before clicking</p>
  </div>
</body>
</html>
