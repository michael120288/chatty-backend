<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Arcane Notification — Level 67</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #4a3a8f; text-align: center; }
    .subtitle { text-align: center; color: rgba(18,18,18,.55); margin-bottom: 40px; }
    .stub-lab { max-width: 580px; margin: 0 auto; background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 12px; padding: 32px; box-shadow: 0 12px 32px rgba(80,60,160,.1); }
    .lab-title { color: #4a3a8f; font-size: 16px; font-weight: bold; margin: 0 0 24px; }
    .action-btn { display: block; width: 100%; padding: 14px; background: #f2edff; border: 1px solid #8f74e8; border-radius: 8px; color: #4a3a8f; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 16px; text-align: center; }
    .action-btn:hover { background: #e6dbff; }
    .log-area { background: #f1f1f4; border: 1px solid rgba(18,18,18,.08); border-radius: 8px; padding: 16px; min-height: 80px; font-family: monospace; font-size: 12px; color: rgba(18,18,18,.6); }
    .log-entry { color: #15803d; margin-bottom: 4px; }
    .note { margin-top: 16px; font-size: 12px; color: rgba(18,18,18,.45); font-style: italic; }
  </style>
</head>
<body>
  <h1>The Arcane Notification</h1>
  <p class="subtitle">Use cy.stub() to intercept window.alert and window.confirm</p>

  <div class="stub-lab">
    <div class="lab-title">🔔 Notification Chamber</div>

    <button class="action-btn" id="alert-btn" onclick="window.alert('⚡ Spell cast successfully!')">Cast Spell (triggers alert)</button>
    <button class="action-btn" id="confirm-btn" onclick="
      var r = window.confirm('Are you sure you want to banish the demon?');
      document.getElementById('confirm-result').textContent = r ? '✅ Demon banished!' : '❌ Demon remains.';
      document.getElementById('confirm-result').style.display = 'block';
    ">Banish Demon (triggers confirm)</button>

    <div class="log-area" id="log-area">
      <div style="color:rgba(18,18,18,.4)">// Stub window.alert and window.confirm to intercept these calls</div>
    </div>
    <div id="confirm-result" style="display:none; margin-top:12px; padding:10px; background:#eafaf0; border:1px solid #16a34a; border-radius:6px; color:#15803d; font-weight:bold;"></div>
    <p class="note">Hint: use cy.stub(win, 'alert') in a cy.window().then() callback before clicking</p>
  </div>
</body>
</html>
