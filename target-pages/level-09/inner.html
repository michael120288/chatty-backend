<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inner Realm</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a1f; color: #eee; margin: 0; padding: 30px;
      display: flex; align-items: center; justify-content: center;
      min-height: 200px;
    }
    .inner-content { text-align: center; }
    .portal-effect {
      display: inline-block; padding: 20px 40px;
      background: radial-gradient(circle, #1a0a3e, #0a0a1f);
      border: 2px solid #7b61ff; border-radius: 50%; margin-bottom: 16px;
    }
    .portal-icon { font-size: 48px; }
    .secret-label { color: #7b61ff; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    #secret-code { font-size: 32px; font-weight: bold; color: #ffd700; letter-spacing: 4px; font-family: monospace; }
    .frame-note { color: #555; font-size: 11px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="inner-content">
    <div class="portal-effect">
      <div class="portal-icon">🌀</div>
    </div>
    <div class="secret-label">Secret Code</div>
    <div id="secret-code">XYZZY</div>
    <div class="frame-note">You are inside the portal iframe</div>
  </div>
</body>
</html>
