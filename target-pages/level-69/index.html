<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Hero Registry — Level 69</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #4a3a8f; text-align: center; }
    .subtitle { text-align: center; color: rgba(18,18,18,.55); margin-bottom: 40px; }
    .registry { max-width: 680px; margin: 0 auto; }
    .registry-header { background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 12px 32px rgba(80,60,160,.1); }
    .registry-title { color: #4a3a8f; font-size: 16px; font-weight: bold; }
    .load-btn { padding: 8px 20px; background: #8f74e8; border: none; border-radius: 6px; color: #ffffff; font-weight: bold; cursor: pointer; font-size: 13px; }
    .load-btn:hover { background: #6f56c9; }
    .hero-table { width: 100%; background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 12px; overflow: hidden; box-shadow: 0 12px 32px rgba(80,60,160,.1); }
    .hero-table th { background: #f3effe; color: #4a3a8f; padding: 12px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: left; }
    .hero-table td { padding: 12px 16px; border-top: 1px solid rgba(18,18,18,.08); font-size: 13px; color: #333; }
    .hero-row:hover td { background: #eef1ff; }
    .empty-state { text-align: center; padding: 40px; color: rgba(18,18,18,.4); }
    .class-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .class-warrior { background: #fff2e8; color: #c2660b; border: 1px solid #f4a35e; }
    .class-mage { background: #f3effe; color: #6f5aa8; border: 1px solid #a78bfa; }
    .class-archer { background: #eafaf0; color: #15803d; border: 1px solid #4ade80; }
  </style>
</head>
<body>
  <h1>The Hero Registry</h1>
  <p class="subtitle">Use cy.fixture() with cy.intercept() to mock the hero data</p>

  <div class="registry">
    <div class="registry-header">
      <div class="registry-title">📋 Registered Heroes</div>
      <button class="load-btn" id="load-heroes-btn" onclick="loadHeroes()">Load Heroes</button>
    </div>
    <table class="hero-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>Level</th>
          <th>Guild</th>
        </tr>
      </thead>
      <tbody id="heroes-tbody">
        <tr><td colspan="4" class="empty-state">Click "Load Heroes" to fetch the registry</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    function loadHeroes() {
      fetch('/api/heroes')
        .then(r => r.json())
        .then(data => {
          const tbody = document.getElementById('heroes-tbody');
          if (!data.heroes || data.heroes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No heroes found</td></tr>';
            return;
          }
          tbody.innerHTML = data.heroes.map(h => `
            <tr class="hero-row">
              <td>${h.name}</td>
              <td><span class="class-badge class-${h.class.toLowerCase()}">${h.class}</span></td>
              <td>${h.level}</td>
              <td>${h.guild}</td>
            </tr>
          `).join('');
        })
        .catch(() => {
          document.getElementById('heroes-tbody').innerHTML = '<tr><td colspan="4" class="empty-state" style="color:#dc2626">Failed to load heroes</td></tr>';
        });
    }
  </script>
</body>
</html>
