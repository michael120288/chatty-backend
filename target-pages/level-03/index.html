<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gate of Authentication — Level 3</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #8f74e8; text-align: center; }
    .subtitle { text-align: center; color: #767676; margin-bottom: 40px; }
    .login-box {
      max-width: 400px; margin: 0 auto;
      background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 12px; padding: 36px;
      box-shadow: 0 12px 32px rgba(80,60,160,.1);
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; color: #5a5a5a; font-size: 14px; }
    input {
      width: 100%; padding: 12px; background: #f8f8f8; border: 1px solid rgba(18,18,18,.14);
      border-radius: 6px; color: #121212; font-size: 15px; box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #8f74e8; }
    button {
      width: 100%; background: #8f74e8; color: white; border: none;
      padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #6a4fe0; }
    #success-message {
      display: none; margin-top: 20px; padding: 14px;
      background: #eafaf0; border: 1px solid #3aa876; border-radius: 8px;
      color: #227a54; text-align: center; font-weight: bold;
    }
    #error-message {
      display: none; margin-top: 20px; padding: 14px;
      background: #fdeef0; border: 1px solid #e94560; border-radius: 8px;
      color: #c22f47; text-align: center;
    }
    .gate-icon { text-align: center; font-size: 60px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Gate of Authentication</h1>
  <p class="subtitle">Only the worthy may pass</p>

  <div class="login-box">
    <div class="gate-icon">🔮</div>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="off" placeholder="Enter your wizard name" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your secret spell" />
      </div>
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    <div id="success-message">⚡ Authentication successful! Welcome, wizard!</div>
    <div id="error-message">❌ Invalid credentials. The gate remains sealed.</div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const success = document.getElementById('success-message');
      const error = document.getElementById('error-message');

      if (user === 'wizard' && pass === 'playwright123') {
        success.style.display = 'block';
        error.style.display = 'none';
      } else {
        error.style.display = 'block';
        success.style.display = 'none';
      }
    });
  </script>
</body>
</html>
