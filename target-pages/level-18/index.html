<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Dimensional Gate — Level 18</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #6f5aa8; text-align: center; }
    .subtitle { text-align: center; color: #6b6b76; margin-bottom: 40px; }
    .gate-area { max-width: 500px; margin: 0 auto; text-align: center; }
    .gate-visual {
      width: 180px; height: 240px; margin: 0 auto 32px;
      border: 3px solid #a78bfa; border-radius: 50% 50% 0 0;
      background: radial-gradient(ellipse, #f3ecff 0%, #ffffff 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 60px; position: relative;
      animation: portalPulse 3s ease-in-out infinite;
    }
    @keyframes portalPulse {
      0%,100% { box-shadow: 0 0 20px rgba(167,139,250,.27); }
      50% { box-shadow: 0 0 40px rgba(167,139,250,.53); }
    }
    .gate-btn {
      background: #a78bfa; color: white; border: none; padding: 16px 32px;
      font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
      transition: background 0.2s, transform 0.1s; margin-bottom: 16px;
    }
    .gate-btn:hover { background: #8f74e8; }
    .gate-btn:active { transform: scale(0.97); }
    .gate-info {
      background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 8px;
      padding: 16px; font-size: 13px; color: #6b6b76; line-height: 1.6; margin-top: 16px;
      box-shadow: 0 12px 32px rgba(80,60,160,.1);
    }
    code { color: #6f5aa8; font-family: monospace; background: #f3ecff; padding: 1px 5px; border-radius: 3px; }
    #gate-status { margin-top: 16px; color: #9a94ab; font-size: 13px; }
    #gate-status.opened { color: #1f9d6b; }
  </style>
</head>
<body>
  <h1>The Dimensional Gate</h1>
  <p class="subtitle">Open the portal — then step through to the other side</p>

  <div class="gate-area">
    <div class="gate-visual">🌀</div>

    <button class="gate-btn" id="open-portal-btn" onclick="openPortal()">
      🌌 Open the Portal
    </button>

    <div class="gate-info">
      Clicking the button opens a <strong>new browser tab</strong>. Use <code>page.waitForEvent('popup')</code>
      to capture it, then interact with the new page just like a regular page object.
    </div>

    <div id="gate-status">Portal inactive</div>
  </div>

  <script>
    function openPortal() {
      document.getElementById('gate-status').textContent = 'Portal opened! A new tab has appeared...';
      document.getElementById('gate-status').className = 'opened';
      window.open('portal.html', '_blank');
    }
  </script>
</body>
</html>
