<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secret Portal</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at center, #0d003a 0%, #0a0014 100%);
      color: #eee; margin: 0; padding: 40px;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .portal-content { text-align: center; }
    .portal-glow { font-size: 80px; filter: drop-shadow(0 0 20px #a855f7); margin-bottom: 24px; }
    h1 { color: #a855f7; font-size: 2em; margin: 0 0 8px; }
    .portal-subtitle { color: #888; margin-bottom: 32px; }
    .secret-box {
      background: #1a0a3e; border: 2px solid #a855f7; border-radius: 12px;
      padding: 24px 40px; display: inline-block;
    }
    .secret-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    .secret-value { font-size: 32px; font-weight: bold; color: #ffd700; letter-spacing: 4px; font-family: monospace; }
    .tab-note { margin-top: 24px; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <div class="portal-content">
    <div class="portal-glow">🌌</div>
    <h1>Secret Portal</h1>
    <p class="portal-subtitle">You crossed the dimensional boundary</p>
    <div class="secret-box">
      <div class="secret-label">Portal Secret</div>
      <div class="secret-value" id="portal-secret">ASTRAL-42</div>
    </div>
    <p class="tab-note">This page opened in a new tab — you are in the popup context</p>
  </div>
</body>
</html>
