<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Library of Elements — Level 1</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #4a3a8f; text-align: center; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #767676; margin-bottom: 40px; }
    .library { max-width: 600px; margin: 0 auto; }
    .item-card {
      background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 8px;
      padding: 20px; margin-bottom: 16px; box-shadow: 0 12px 32px rgba(80,60,160,.1);
    }
    .item-card h2 { margin: 0 0 8px; color: #6f5aa8; }
    .item-card p { margin: 0; color: #5a5a5a; font-size: 14px; }
    #featured-item {
      background: linear-gradient(135deg, #c3acff, #cbd5ff);
      border-color: #8f74e8; border-width: 2px;
      font-size: 18px; font-weight: bold; color: #4a3a8f;
      padding: 24px; text-align: center; border-radius: 8px; margin-bottom: 20px;
    }
    .item-testid { border-color: #6f8cff; }
    .item-role { border-color: #8f74e8; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 12px; margin-left: 8px;
    }
    .badge-legendary { background: #8f74e8; color: white; }
    .badge-common { background: #9a9a9a; color: white; }
    .badge-rare { background: #cbd5ff; color: #121212; }
  </style>
</head>
<body>
  <h1>Library of Elements</h1>
  <p class="subtitle">Master the art of selection</p>

  <div class="library">
    <div id="featured-item">Magic Sword</div>

    <div class="item-card">
      <h2>Scroll of Wisdom <span class="badge badge-legendary">Legendary</span></h2>
      <p data-testid="scroll-description">An ancient scroll containing the secrets of the DOM.</p>
    </div>

    <div class="item-card item-testid" data-testid="potion-card">
      <h2>Health Potion <span class="badge badge-common">Common</span></h2>
      <p>Restores 50 HP when consumed.</p>
    </div>

    <div class="item-card item-role" role="article" aria-label="Dragon Scale">
      <h2>Dragon Scale <span class="badge badge-rare">Rare</span></h2>
      <p>Dropped by the ancient fire drake. Fireproof.</p>
    </div>
  </div>
</body>
</html>
