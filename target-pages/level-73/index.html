<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Awakening Chamber — Level 73</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #6f5aa8; text-align: center; }
    .subtitle { text-align: center; color: rgba(18,18,18,.55); margin-bottom: 40px; }
    .chamber { max-width: 580px; margin: 0 auto; background: #ffffff; border: 1px solid rgba(18,18,18,.08); border-radius: 12px; padding: 32px; text-align: center; box-shadow: 0 12px 32px rgba(80,60,160,.1); }
    .chamber-title { color: #6f5aa8; font-size: 16px; font-weight: bold; margin: 0 0 24px; }
    .sleeping { font-size: 60px; margin-bottom: 16px; }
    .awaken-btn { padding: 12px 28px; background: #f3effe; border: 1px solid #a78bfa; border-radius: 8px; color: '#a78bfa'; font-size: 14px; cursor: pointer; color: #6f5aa8; }
    .awaken-btn:hover { background: #e9defc; }
    #awakened-content { display: none; margin-top: 24px; background: #f9f7ff; border: 1px solid #a78bfa; border-radius: 10px; padding: 20px; }
    .awakened-title { color: #6f5aa8; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    #power-level { font-size: 32px; font-weight: bold; color: #b8860b; }
    .awakened-desc { color: rgba(18,18,18,.55); font-size: 13px; margin-top: 8px; }
    #status-text { color: rgba(18,18,18,.45); font-size: 13px; margin-top: 16px; font-style: italic; }
  </style>
</head>
<body>
  <h1>The Awakening Chamber</h1>
  <p class="subtitle">Cypress automatically retries assertions — no need to manually wait</p>

  <div class="chamber">
    <div class="chamber-title">💤 The Ancient Guardian</div>
    <div class="sleeping">😴</div>
    <button class="awaken-btn" id="awaken-btn" onclick="awakenGuardian()">Awaken the Guardian</button>
    <div id="status-text">Guardian is sleeping...</div>

    <div id="awakened-content">
      <div class="awakened-title">⚡ Guardian Awakened!</div>
      <div id="power-level">OVER 9000</div>
      <div class="awakened-desc">The ancient guardian has stirred from its eternal slumber</div>
    </div>
  </div>

  <script>
    function awakenGuardian() {
      document.getElementById('awaken-btn').disabled = true;
      document.getElementById('status-text').textContent = 'Awakening in progress...';
      setTimeout(function() {
        document.getElementById('awakened-content').style.display = 'block';
        document.getElementById('status-text').textContent = 'Guardian is awake!';
        document.querySelector('.sleeping').textContent = '⚡';
      }, 2000);
    }
  </script>
</body>
</html>
