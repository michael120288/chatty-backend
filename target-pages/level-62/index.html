<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Oracle's Chain — Level 62</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f8f8; color: #121212; margin: 0; padding: 40px; }
    h1 { color: #8f74e8; text-align: center; }
    .subtitle { text-align: center; color: #6b6b7d; margin-bottom: 40px; }
    .oracle-panel { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid rgba(18,18,18,.14); border-radius: 12px; padding: 32px; box-shadow: 0 12px 32px rgba(80,60,160,.1); }
    .oracle-title { color: #8f74e8; font-size: 18px; font-weight: bold; margin: 0 0 20px; }
    .prophecy { background: #f3f1ff; border: 1px solid #d8cdfa; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .prophecy-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8a8a9a; margin-bottom: 6px; }
    .prophecy-text { color: #6f5aa8; font-size: 15px; font-weight: bold; }
    .stat-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .stat-box { flex: 1; background: #f6f6fb; border: 1px solid rgba(18,18,18,.08); border-radius: 8px; padding: 12px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; color: #8f74e8; }
    .stat-label { font-size: 11px; color: #8a8a9a; margin-top: 4px; }
    .action-btn { width: 100%; padding: 12px; background: #8f74e8; border: none; border-radius: 8px; color: #ffffff; font-size: 14px; cursor: pointer; }
    .action-btn:hover { background: #7a5fd6; }
    #reveal-output { display: none; margin-top: 16px; background: #eafaf0; border: 1px solid #3fae62; border-radius: 8px; padding: 12px; color: #1f7a3d; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <h1>The Oracle's Chain</h1>
  <p class="subtitle">Use .then(), .its(), .invoke(), and cy.wrap() to chain and transform</p>

  <div class="oracle-panel" data-oracle-level="supreme" data-power="9000">
    <div class="oracle-title">Supreme Oracle</div>
    <div class="prophecy">
      <div class="prophecy-label">Current Prophecy</div>
      <div class="prophecy-text" id="prophecy-text">The dragon sleeps beneath the mountain</div>
    </div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-value" id="wisdom-val">42</div>
        <div class="stat-label">Wisdom</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="power-val">9000</div>
        <div class="stat-label">Power</div>
      </div>
    </div>
    <button class="action-btn" id="invoke-btn" onclick="document.getElementById('reveal-output').style.display='block'">Invoke the Oracle</button>
    <div id="reveal-output">⚡ The oracle has spoken!</div>
  </div>
</body>
</html>
