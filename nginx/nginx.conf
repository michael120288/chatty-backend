worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ──────────────────────────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # ── Performance ───────────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml
             application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # ── Rate limiting zones ───────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  # Auth rate limiting moved to Express (express-rate-limit) — handles x-test-secret bypass


  # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name codeandtest.com www.codeandtest.com;
    return 301 https://$host$request_uri;
  }

  # ── Redirect www → apex (HTTPS) ───────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name www.codeandtest.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://codeandtest.com$request_uri;
  }

  # ── HTTPS — Frontend + API proxy ─────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name codeandtest.com;

    # SSL — replace with your cert paths (or use Certbot / Let's Encrypt)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.codeandtest.com wss://codeandtest.com wss://api.codeandtest.com; media-src 'self' blob: https:; frame-src https:; worker-src blob:; frame-ancestors 'self'; object-src 'none';" always;

    client_max_body_size 55m;  # slightly above the 50MB image upload limit

    # ── API routes → backend ──────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass         http://backend:5000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Socket.IO → backend ───────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://backend:5000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Static React app ──────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
