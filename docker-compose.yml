version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatty-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.production
    volumes:
      # Mount Docker socket so the backend can spawn sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Share host /tmp so sandbox volume mounts resolve on the host filesystem
      - /tmp:/tmp
    depends_on:
      - redis
    logging:
      driver: awslogs
      options:
        awslogs-group: /chatty/backend
        awslogs-region: eu-west-1
        awslogs-stream: backend

  redis:
    image: redis:7-alpine
    container_name: chatty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: awslogs
      options:
        awslogs-group: /chatty/redis
        awslogs-region: eu-west-1
        awslogs-stream: redis

volumes:
  redis-data:
