services:
  caddy:
    image: caddy:alpine
    container_name: chatty-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging:
      driver: awslogs
      options:
        awslogs-group: /chatty/caddy
        awslogs-region: eu-west-1
        awslogs-stream: caddy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatty-backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env.production
    volumes:
      # Mount Docker socket so the backend can spawn sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Share host /tmp so sandbox volume mounts resolve on the host filesystem
      - /tmp:/tmp
    depends_on:
      - redis
    logging:
      driver: awslogs
      options:
        awslogs-group: /chatty/backend
        awslogs-region: eu-west-1
        awslogs-stream: backend

  redis:
    image: redis:7-alpine
    container_name: chatty-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: awslogs
      options:
        awslogs-group: /chatty/redis
        awslogs-region: eu-west-1
        awslogs-stream: redis

volumes:
  redis-data:
  caddy_data:
  caddy_config:
